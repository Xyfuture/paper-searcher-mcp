[project]
name = "paper-searcher-mcp"
version = "0.1.0"
description = "MCP server for searching and downloading academic papers from DBLP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.13.1",
    "requests>=2.32.5",
    "selectolax>=0.4.3",
]

[project.scripts]
paper-searcher-mcp = "main:mcp.run"
